# Relevo de datos del SIATA: cada 5 minutos descarga los datos del geoportal (que no envía
# CORS) con scripts/datos.mjs y los publica en la rama "datos", de donde la PWA los lee por
# raw.githubusercontent.com. La rama tiene un solo commit que se reemplaza en cada corrida,
# así no crece la historia del repo.
#
# GitHub no garantiza la hora exacta de los flujos programados: con carga suelen correr cada
# 5-15 minutos. En repos públicos, GitHub desactiva los flujos programados tras 60 días sin
# actividad en el repo; si pasa, se reactivan desde la pestaña Actions.
name: Datos del SIATA

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  relevo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Traer los datos anteriores (para conservar lo que falle y los umbrales)
        run: |
          mkdir -p datos
          if git fetch --depth=1 origin datos 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C datos
          fi

      - name: Descargar del SIATA
        run: node scripts/datos.mjs

      - name: Publicar en la rama "datos"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd datos
          git init -q -b datos
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Datos del SIATA $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" datos
