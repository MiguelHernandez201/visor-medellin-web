<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" width="130" height="130">
  <!-- Ícono de Visor Medellín. Se exporta a los PNG de public/icons/ con: npm run iconos -->
  <defs>
    <radialGradient id="fondo" cx="50%" cy="0%" r="110%">
      <stop offset="0" stop-color="#10233a"/>
      <stop offset="0.65" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#b9cde0"/>
    </linearGradient>
    <linearGradient id="cono" gradientUnits="userSpaceOnUse" x1="28" y1="0" x2="-4" y2="0">
      <stop offset="0" stop-color="#36c5ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#36c5ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="marco">
      <rect x="3" y="3" width="124" height="124" rx="28"/>
    </clipPath>
  </defs>

  <rect x="3" y="3" width="124" height="124" rx="28" fill="url(#fondo)"/>

  <g clip-path="url(#marco)">
    <!-- Soporte en la pared -->
    <rect x="100" y="20" width="12" height="36" rx="3" fill="#36c5ff"/>
    <path d="M104 36 H80 V44" stroke="#36c5ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <g transform="rotate(-20 64 62)">
      <!-- Haz de visión -->
      <path d="M28 63 L-30 30 L-30 100 Z" fill="url(#cono)"/>
      <!-- Cuerpo -->
      <rect x="34" y="50" width="56" height="26" rx="6" fill="url(#cuerpo)"/>
      <!-- Visera -->
      <rect x="26" y="44" width="62" height="8" rx="4" fill="#36c5ff"/>
      <!-- Lente -->
      <rect x="25" y="54" width="13" height="18" rx="3" fill="#0d1420"/>
      <circle cx="31.5" cy="63" r="5.2" fill="#36c5ff"/>
      <circle cx="30" cy="61.5" r="1.7" fill="#eef6ff"/>
      <!-- Luz de grabación -->
      <circle cx="80" cy="63" r="4.5" fill="#ff4d5e"/>
    </g>

    <!-- Esquinas de visor -->
    <g stroke="#36c5ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M86 108 H106 V90"/>
      <path d="M44 108 H24 V90" stroke-opacity="0.45"/>
    </g>
  </g>

  <rect x="4" y="4" width="122" height="122" rx="27" fill="none" stroke="#36c5ff" stroke-opacity="0.35" stroke-width="2"/>
</svg>
